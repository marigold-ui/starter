allowBuilds:
  esbuild: true
packages:
  - 'src/*'
# Ported from .npmrc, which pnpm 11 no longer reads for anything but auth/registry.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # First-party packages, so the supply-chain cooldown adds no value here and
  # would block prereleases (e.g. Marigold 18 RCs) for a week.
  - '@marigold/*'
  # React Aria and its satellites: Marigold tracks them closely, so a 7-day
  # cooldown here blocks Marigold releases rather than gating anything useful.
  - '@internationalized/*'
  - '@react-aria/*'
  - '@react-stately/*'
  - '@react-types/*'
  - 'react-aria*'
  - 'react-stately*'
  # postcss@8.5.26 is the fix for GHSA-2v37-7h3g-55p8 (high) in its nanoid
  # dependency. It was published 2026-08-06, so the 7-day cooldown would hold a
  # security patch hostage until 2026-08-13 -- which is the one thing the
  # cooldown must not do. Remove this entry once 8.5.26 has aged past the cutoff.
  - 'postcss'
